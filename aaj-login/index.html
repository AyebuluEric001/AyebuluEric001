<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AAJ Express Corporate Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
  /* Layout: inset photo panel on the left (rounded, 70% black overlay), centered form column on the right. */
  :root {
    --orange: #FF4D00;
    --orange-deep: #D93F00;
    --page: #F8F8F8;
    --ink: #101010;
    --muted: #4A4A4A;
    --placeholder: #9A9CA3;
    --border: #E8EAED;
    --error: #C62828;
    --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: var(--orange); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; border-radius: 8px; }

  .page {
    min-height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 20px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }

  /* Hero panel */
  .hero {
    position: relative;
    border-radius: 30px;
    overflow: hidden;
    min-height: calc(100vh - 40px);
    color: #fff;
    background: #1a1410 url("assets/hero.jpg") center top / cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(28px, 4.4vw, 62px);
    isolation: isolate;
  }
  .hero::before { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, .7); z-index: -1; }
  .logo { width: clamp(120px, 11vw, 157px); height: auto; display: block; }
  .hero h2 { margin: 0; font-size: clamp(28px, 3.1vw, 44px); font-weight: 500; line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
  .hero p { margin: 14px 0 0; max-width: 28em; font-size: clamp(15px, 1.4vw, 19px); font-weight: 400; line-height: 1.5; color: rgba(255,255,255,.82); }

  /* Form column */
  .panel { display: flex; align-items: center; justify-content: center; padding: 24px 0; min-width: 0; }
  .form-wrap { width: 100%; max-width: 454px; }
  .form-wrap h1 { margin: 0; text-align: center; font-size: clamp(30px, 3vw, 38px); font-weight: 500; letter-spacing: -.02em; line-height: 1.2; }
  .form-wrap .sub { margin: 14px 0 0; text-align: center; color: var(--muted); font-size: 15px; }

  form { margin-top: 44px; }
  .field + .field { margin-top: 24px; }
  label { display: block; font-size: 15px; font-weight: 500; margin-bottom: 10px; }
  .input {
    position: relative;
    display: flex;
    align-items: center;
    height: 54px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: border-color .15s, box-shadow .15s;
  }
  .input:focus-within { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255, 77, 0, .14); }
  .input[data-invalid="true"] { border-color: var(--error); }
  .input input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    background: transparent;
    padding: 0 18px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    border-radius: 10px;
  }
  .input input::placeholder { color: var(--placeholder); }
  .input input:focus { outline: none; }
  .eye { flex: none; width: 48px; height: 100%; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; color: #6B6F78; cursor: pointer; border-radius: 10px; }
  .eye:hover { color: var(--ink); }
  .eye svg { width: 20px; height: 20px; }
  .err { min-height: 0; margin: 6px 2px 0; font-size: 13px; color: var(--error); }
  .err:empty { display: none; }

  .forgot { display: block; width: max-content; margin: 14px 0 0 auto; font-size: 15px; }

  .btn {
    margin-top: 48px;
    width: 100%;
    height: 55px;
    border: 0;
    border-radius: 8px;
    background: var(--orange);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }
  .btn:hover { background: var(--orange-deep); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .7; cursor: progress; }

  .notice { margin: 18px 0 0; padding: 12px 14px; border-radius: 10px; font-size: 14px; background: #FFF1EA; color: #8A2E00; border: 1px solid #FFD6C2; }
  .notice[hidden] { display: none; }

  .register { margin: 28px 0 0; text-align: center; font-size: 15px; }
  .register a { margin-left: 4px; }

  /* Tablet and phone: photo panel becomes a compact header above the form */
  @media (max-width: 900px) {
    .page { grid-template-columns: 1fr; gap: 0; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .hero { min-height: 0; border-radius: 22px; gap: 56px; padding: 24px; background-position: center 18%; }
    .hero h2 { font-size: 26px; }
    .hero p { font-size: 15px; }
    .panel { padding: 36px 0 24px; }
    form { margin-top: 32px; }
    .btn { margin-top: 36px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="page">
  <aside class="hero" aria-label="AAJ Express">
    <img class="logo" src="assets/aaj-express-logo.png" alt="AAJ Express">
    <div>
      <h2>Delivery Without Limits</h2>
      <p>Discounted nationwide delivery rates without compromise on speed and ease.</p>
    </div>
  </aside>

  <main class="panel">
    <div class="form-wrap">
      <h1>Welcome back!</h1>
      <p class="sub">Enter your details to get started.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input" id="emailBox">
            <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="Enter email address" aria-describedby="emailErr" required>
          </div>
          <p class="err" id="emailErr" role="alert"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input" id="pwBox">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="pwErr" required>
            <button class="eye" type="button" id="togglePw" aria-label="Show password" aria-pressed="false">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6 0 9.5 7 9.5 7a15.600 15.600 0 0 1-2.400 3.200M6.600 6.600A15.600 15.600 0 0 0 2.500 12S6 19 12 19a9.700 9.700 0 0 0 5.400-1.600"/>
                <path d="M9.900 9.900a3 3 0 0 0 4.200 4.200"/>
                <path id="eyeSlash" d="M3 3l18 18"/>
              </svg>
            </button>
          </div>
          <p class="err" id="pwErr" role="alert"></p>
        </div>

        <a class="forgot" id="forgotLink" href="#">Forget Password?</a>

        <button class="btn" id="submitBtn" type="submit">Login</button>
        <p class="notice" id="notice" role="status" hidden></p>
      </form>

      <p class="register">Don’t have an account?<a id="registerLink" href="#">Register</a></p>
    </div>
  </main>
</div>

<script>
/* ---------- Configuration: fill in before launch ---------- */
var CONFIG = {
  loginEndpoint: "",   // TODO: POST endpoint that accepts { email, password } and returns JSON. Blank = no sign-in attempt is made.
  redirectAfterLogin: "", // TODO: where to send the user after a successful login
  registerUrl: "",     // TODO: registration page
  forgotPasswordUrl: "" // TODO: password reset page
};

var form = document.getElementById("loginForm");
var email = document.getElementById("email"), password = document.getElementById("password");
var emailBox = document.getElementById("emailBox"), pwBox = document.getElementById("pwBox");
var emailErr = document.getElementById("emailErr"), pwErr = document.getElementById("pwErr");
var notice = document.getElementById("notice"), submitBtn = document.getElementById("submitBtn");

function showNotice(msg) { notice.textContent = msg; notice.hidden = false; }
function setError(box, input, el, msg) {
  el.textContent = msg; box.dataset.invalid = msg ? "true" : "false";
  input.setAttribute("aria-invalid", msg ? "true" : "false");
}

/* Links: use real destinations when configured, otherwise say so instead of doing nothing */
[["registerLink", "registerUrl", "Registration"], ["forgotLink", "forgotPasswordUrl", "Password reset"]].forEach(function (x) {
  var a = document.getElementById(x[0]), url = CONFIG[x[1]];
  if (url) { a.href = url; }
  else { a.addEventListener("click", function (e) { e.preventDefault(); showNotice(x[2] + " page has not been connected yet."); }); }
});

/* Show / hide password */
var toggle = document.getElementById("togglePw"), slash = document.getElementById("eyeSlash");
toggle.addEventListener("click", function () {
  var show = password.type === "password";
  password.type = show ? "text" : "password";
  toggle.setAttribute("aria-pressed", String(show));
  toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
  slash.style.display = show ? "none" : "";
});

email.addEventListener("input", function () { setError(emailBox, email, emailErr, ""); });
password.addEventListener("input", function () { setError(pwBox, password, pwErr, ""); });

form.addEventListener("submit", function (e) {
  e.preventDefault();
  notice.hidden = true;
  var ok = true, v = email.value.trim();
  if (!v) { setError(emailBox, email, emailErr, "Enter your email address."); ok = false; }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { setError(emailBox, email, emailErr, "Enter a valid email address, like name@company.com."); ok = false; }
  if (!password.value) { setError(pwBox, password, pwErr, "Enter your password."); ok = false; }
  if (!ok) { (emailBox.dataset.invalid === "true" ? email : password).focus(); return; }

  if (!CONFIG.loginEndpoint) { showNotice("Sign-in is not connected to a server yet, so no login was attempted."); return; }

  submitBtn.disabled = true; submitBtn.textContent = "Signing in…";
  fetch(CONFIG.loginEndpoint, { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include", body: JSON.stringify({ email: v, password: password.value }) })
    .then(function (r) { if (!r.ok) throw new Error("bad"); return r; })
    .then(function () { if (CONFIG.redirectAfterLogin) location.href = CONFIG.redirectAfterLogin; else showNotice("Signed in."); })
    .catch(function () { showNotice("We couldn't sign you in. Check your email and password and try again."); })
    .finally(function () { submitBtn.disabled = false; submitBtn.textContent = "Login"; });
});
</script>
</body>
</html>
